# Guards the sandbox image every run happens in (CONTEXT.md: Sandbox, Harness).
# The image bakes the harness in at build time, so a build that silently drops
# it leaves every run without its skills — this is what catches that.
name: Sandbox image

on:
  push:
    paths:
      - Dockerfile
      - .dockerignore
      - scripts/verify-harness.ts
      - .github/workflows/sandbox-image.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - scripts/verify-harness.ts
      - .github/workflows/sandbox-image.yml
  # The likeliest way the harness disappears changes no file here: the image
  # installs the CLI and the plugin unpinned, so a marketplace that drops the
  # plugin, or a CLI release that moves where plugins live, breaks a build the
  # paths above would never trigger. The weekly build is what notices that.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# One build per ref is enough; a burst of pushes should not queue several
# multi-minute builds of the same thing.
concurrency:
  group: sandbox-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build the image and verify the harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Both steps are npm scripts so the docker invocations have one
      # definition (package.json) that CI and a local check share.
      - name: Build the image
        run: npm run sandbox:build

      # No credential is passed: the check reads the installed plugin off disk
      # rather than prompting, so it needs no subscription token. The script is
      # mounted rather than copied so the image stays what a run actually gets.
      - name: Verify the harness
        run: npm run sandbox:verify
