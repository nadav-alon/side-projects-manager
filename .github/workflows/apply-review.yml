# Turns a developer's `/apply-review` comment into an apply-review ticket: an
# issue asking an agent to work every open review thread on a pull request,
# linked as a sub-issue of the ticket the pull request closes.
name: Apply review

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write

jobs:
  apply-review:
    # Narrowed to the repo owner here, at the job level, so an unrelated
    # comment costs nothing beyond this one check. The trimmed-body check
    # can't live here too — Actions expressions have no trim() — so it runs
    # first inside the script below, and anything that fails it exits silently.
    if: github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the pull request and act on it
        id: apply
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          IS_PULL_REQUEST: ${{ github.event.issue.pull_request != null }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail

          # Both read by the failure step below: the command that broke, and
          # what it said. Stderr is teed so it still reaches the run log.
          exec 2> >(tee "${RUNNER_TEMP}/apply-review-stderr.txt" >&2)
          trap 'printf "%s\n" "$BASH_COMMAND" > "${RUNNER_TEMP}/apply-review-command.txt"' ERR

          trimmed="$(printf '%s' "$COMMENT_BODY" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [[ "$trimmed" != "/apply-review" ]]; then
            exit 0
          fi

          # The REST issue-comments endpoint, not `gh issue comment`: the
          # comment may be on a pull request, whose number `gh issue` refuses.
          reply() {
            gh api "repos/$REPO/issues/$ISSUE_NUMBER/comments" -f body="$1" >/dev/null
          }

          # GitHub's nine closing keywords up to the `#`, starting at a word
          # boundary. Matched case-insensitively. Written in the ERE subset
          # both grep and jq's regex engine read alike, so one copy serves both.
          CLOSING_KEYWORD='(^|[^[:alnum:]_])(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]*:?[[:space:]]*#'

          # The first Closes/Fixes/Resolves #N in $1.
          closing_number() {
            grep -ioE "${CLOSING_KEYWORD}[0-9]+" <<<"$1" \
              | head -n1 \
              | grep -oE '[0-9]+' \
              || true
          }

          # Bodies saved from the web UI end their lines in \r\n, which would
          # keep every `$`-anchored line match below from ever matching.
          issue_body="${ISSUE_BODY//$'\r'/}"

          PR_NUMBER=""
          PR_URL=""
          N=""
          FAIL_REASON=""

          if [[ "$IS_PULL_REQUEST" == "true" ]]; then
            # On a pull request (primary): that pull request, open.
            pr_json="$(gh pr view "$ISSUE_NUMBER" --repo "$REPO" --json number,state,body,url)"
            pr_state="$(jq -r .state <<<"$pr_json")"
            if [[ "$pr_state" != "OPEN" ]]; then
              FAIL_REASON="that pull request is not open (state: $pr_state), so there is nothing to apply a review to."
            else
              n="$(closing_number "$(jq -r .body <<<"$pr_json")")"
              if [[ -z "$n" ]]; then
                FAIL_REASON="its body names no Closes/Fixes/Resolves #N, so I can't tell which ticket it is for."
              else
                PR_NUMBER="$ISSUE_NUMBER"
                PR_URL="$(jq -r .url <<<"$pr_json")"
                N="$n"
              fi
            fi
          elif grep -qE '^Review https?://' <<<"$issue_body"; then
            # On a review ticket (open or closed): the URL and #N from its
            # fixed body line, read back the way it was written.
            review_line="$(grep -m1 -E '^Review (\S+), the draft pull request opened for #[0-9]+\.$' <<<"$issue_body" || true)"
            if [[ -z "$review_line" ]]; then
              FAIL_REASON="this looks like a review ticket, but no line of its body reads \`Review <url>, the draft pull request opened for #N.\`, so I can't tell which pull request it is for."
            else
              candidate_url="$(sed -E 's@^Review (\S+), the draft pull request opened for #([0-9]+)\.$@\1@' <<<"$review_line")"
              candidate_n="$(sed -E 's@^Review (\S+), the draft pull request opened for #([0-9]+)\.$@\2@' <<<"$review_line")"
              if [[ ! "$candidate_url" =~ ^https://github\.com/([^/]+/[^/]+)/pull/([0-9]+)$ ]]; then
                FAIL_REASON="its Review line names $candidate_url, which is not a pull request URL."
              else
                candidate_repo="${BASH_REMATCH[1]}"
                candidate_number="${BASH_REMATCH[2]}"
                # Not guarded: a pull request that can't be read is an error
                # for the failure step to report, not a pull request that is
                # closed.
                pr_json="$(gh pr view "$candidate_number" --repo "$candidate_repo" --json number,state,url)"
                pr_state="$(jq -r .state <<<"$pr_json")"
                if [[ "$pr_state" != "OPEN" ]]; then
                  FAIL_REASON="its pull request ($candidate_url) is not open (state: $pr_state), so there is nothing to apply a review to."
                else
                  PR_NUMBER="$candidate_number"
                  PR_URL="$(jq -r .url <<<"$pr_json")"
                  N="$candidate_n"
                fi
              fi
            fi
          else
            # On an implementation ticket: only if exactly one open draft
            # pull request closes it.
            N="$ISSUE_NUMBER"
            matches="$(gh pr list --repo "$REPO" --state open --json number,url,body,isDraft --limit 500 \
              | jq -c --arg keyword "$CLOSING_KEYWORD" --arg n "$N" '[.[] | select(.isDraft) | select(.body | test($keyword + $n + "([^0-9]|$)"; "i"))]')"
            count="$(jq 'length' <<<"$matches")"
            if [[ "$count" == "0" ]]; then
              FAIL_REASON="no open draft pull request closes #$N, so there is nothing to apply a review to."
            elif [[ "$count" -gt 1 ]]; then
              FAIL_REASON="$count open draft pull requests close #$N, so I can't tell which one to apply a review to."
            else
              PR_NUMBER="$(jq -r '.[0].number' <<<"$matches")"
              PR_URL="$(jq -r '.[0].url' <<<"$matches")"
            fi
          fi

          if [[ -n "$FAIL_REASON" ]]; then
            reply "Can't open an apply-review ticket here: $FAIL_REASON"
            exit 0
          fi

          expected_line="Apply the review on $PR_URL, the draft pull request opened for #$N."
          existing_number="$(gh issue list --repo "$REPO" --state open --json number,body --limit 500 \
            | jq -r --arg line "$expected_line" '[.[] | select(.body | contains($line))][0].number // empty')"

          if [[ -n "$existing_number" ]]; then
            reply "There is already an open apply-review ticket for this: #$existing_number."
            exit 0
          fi

          title="Apply the review on #$PR_NUMBER"
          body="$expected_line"

          # Best effort: refused only where the label already exists, which is
          # every project triaged by hand before this workflow ever ran.
          gh label create ready-for-agent --repo "$REPO" \
            --description "Fully specified, ready for an AFK agent" >/dev/null 2>&1 || true

          # A refusal here is the failure step's to report, which knows to say
          # nothing was created.
          create_out="$(gh issue create --repo "$REPO" --title "$title" --body "$body" --label ready-for-agent)"

          new_url="$(printf '%s' "$create_out" | tail -n1 | tr -d '[:space:]')"
          new_number="$(grep -oE '[0-9]+$' <<<"$new_url")"

          # The issue exists by now, so a refused link is reported rather than
          # failed on; the reply says which fallback, if any, took its place.
          link_note=""
          link_err="${RUNNER_TEMP}/apply-review-link-err.txt"
          if ! issue_id="$(gh api "repos/$REPO/issues/$new_number" --jq .id 2>"$link_err")" \
            || ! gh api --method POST "repos/$REPO/issues/$N/sub_issues" -F "sub_issue_id=$issue_id" >/dev/null 2>"$link_err"; then
            link_why="$(<"$link_err")"
            link_why="${link_why//$'\n'/ }"
            if gh issue edit "$new_number" --repo "$REPO" --body "Part of #$N."$'\n\n'"$body" >/dev/null 2>"$link_err"; then
              link_note=" It isn't linked as a sub-issue of #$N (${link_why}), so its body opens with \`Part of #$N.\` instead."
            else
              edit_why="$(<"$link_err")"
              edit_why="${edit_why//$'\n'/ }"
              link_note=" It isn't linked to #$N at all: the sub-issue link was refused (${link_why}), and so was adding \`Part of #$N.\` to its body (${edit_why}). Link it by hand."
            fi
          fi

          gh api "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=eyes >/dev/null 2>&1 || true
          reply "Opened $new_url to apply the review.$link_note"

      - name: Reply with the failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          command="$(cat "${RUNNER_TEMP}/apply-review-command.txt" 2>/dev/null || echo "an unrecorded command")"
          stderr="$(tail -n 20 "${RUNNER_TEMP}/apply-review-stderr.txt" 2>/dev/null || true)"

          if grep -qiE '403|Resource not accessible' <<<"$stderr"; then
            # The permissions: entry the refused call is covered by.
            case "$command" in
              *"gh pr "*) entry="pull-requests: write" ;;
              *) entry="issues: write" ;;
            esac
            body="Can't open an apply-review ticket: the workflow's \`GITHUB_TOKEN\` was refused \`$entry\`. The workflow asks for it under \`permissions:\`, so the repository's or organization's Actions settings are withholding it (Settings → Actions → General → Workflow permissions)."
          else
            body="Can't open an apply-review ticket: \`$command\` failed."
          fi
          if [[ -n "$stderr" ]]; then
            body+=$'\n\n```\n'"$stderr"$'\n```'
          fi
          if [[ "$command" == *"gh issue create"* ]]; then
            body+=$'\n\n'"Nothing was created: comment /apply-review again to retry."
          fi
          # REST for the same reason as reply() above.
          gh api "repos/$REPO/issues/$ISSUE_NUMBER/comments" -f body="$body" >/dev/null
